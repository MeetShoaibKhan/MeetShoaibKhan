<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Animated code lines -->
  <g font-family="monospace" font-size="12" fill="#10b981" filter="url(#glow)">
    <text x="50" y="30" opacity="0.8">const developer = {</text>
    <text x="70" y="50" opacity="0.6">  name: 'Shoaib Khan',</text>
    <text x="70" y="70" opacity="0.7">  skills: ['JavaScript', 'React', 'Python'],</text>
    <text x="70" y="90" opacity="0.5">  passion: 'Building amazing things'</text>
    <text x="50" y="110" opacity="0.8">};</text>
    
    <animateTransform attributeName="transform" type="translate" 
                      values="0,0; 5,0; 0,0" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Binary rain effect -->
  <g font-family="monospace" font-size="10" fill="#059669" opacity="0.3">
    <text x="200" y="0">1010101010
      <animate attributeName="y" values="0;220" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="350" y="0">1100110011
      <animate attributeName="y" values="0;220" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="0">0101010101
      <animate attributeName="y" values="0;220" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="650" y="0">1111000011
      <animate attributeName="y" values="0;220" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="800" y="0">0011001100
      <animate attributeName="y" values="0;220" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="950" y="0">1010101010
      <animate attributeName="y" values="0;220" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4.2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Animated brackets -->
  <g font-family="monospace" font-size="24" fill="#3b82f6" opacity="0.8">
    <text x="20" y="140">&lt;</text>
    <text x="1160" y="140">/&gt;</text>
    <animateTransform attributeName="transform" type="scale" 
                      values="1;1.1;1" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="300" cy="150" r="2" fill="#8b5cf6" opacity="0.6">
    <animate attributeName="cy" values="150;130;150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="160" r="1.5" fill="#f59e0b" opacity="0.7">
    <animate attributeName="cy" values="160;140;160" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="140" r="2.5" fill="#ef4444" opacity="0.5">
    <animate attributeName="cy" values="140;120;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>